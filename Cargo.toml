[package]
name = "kommit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Kafka, except every record is a Git commit."

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.88", features = ["anyhow"] }
kafka-protocol = { version = "0.18", features = ["messages_enums"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
